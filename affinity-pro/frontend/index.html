    <style>
      :root { color-scheme: light dark; }
      html, body { 
          background-color: #0A0A0A; 
          -webkit-user-select: none;
          user-select: none; /* Text selection protection */
      }
      @media (prefers-color-scheme: light) {
        html, body { background-color: #F4F5F7; }
      }
      /* Allow text selection in inputs/textareas */
      input, textarea, [contenteditable="true"] {
          -webkit-user-select: text;
          user-select: text;
      }
    </style>
  </head>
  <body>
    <!-- Invisible Watermark Overlay -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999999; display: flex; flex-wrap: wrap; overflow: hidden; opacity: 0.01;">
      <script>
        // Generate invisible watermarks across the screen
        document.write(Array(100).fill('<span style="padding:20px; font-size:12px; font-weight:bold;">© 2026 My Design</span>').join(''));
      </script>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Prevent pinch-to-zoom.
      document.addEventListener('touchmove', function (event) {
        if (event.scale !== 1 && event.touches.length > 1) event.preventDefault();
      }, { passive: false });

      // Prevent double-tap-to-zoom.
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, false);

      // Prevent macOS trackpad gesture zoom.
      document.addEventListener('gesturestart', function (event) { event.preventDefault(); });

      // 🌟 COPYRIGHT PROTECTION 🌟
      // Prevent Right-Click
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Console Warning
      console.log("%cStop!", "color: red; font-family: sans-serif; font-size: 4.5em; font-weight: bolder; text-shadow: #000 1px 1px;");
      console.log("%cThis is a browser feature intended for developers. If someone told you to copy-paste something here to enable a feature or 'hack' another user's account, it is a scam and will give them access to your account.", "font-family: sans-serif; font-size: 1.25em;");
      console.log("%c© 2026 My Koy (My Design). Crafted with Passion.", "color: #0277C5; font-weight: bold; font-size: 1.25em;");
    </script>
  </body>
